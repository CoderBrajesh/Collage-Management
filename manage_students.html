<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students | Gaya College</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 40px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--primary-color);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .student-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .student-table th,
        .student-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .student-table th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 500;
        }

        .action-btn {
            background: #ef4444;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
        }

        .action-btn:hover {
            background: #dc2626;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .active-status {
            background: #dcfce7;
            color: #166534;
        }

        .pending-status {
            background: #fef9c3;
            color: #854d0e;
        }

        .inactive-status {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body style="background-color: #f8fafc;">

    <!-- Navigation -->
    <nav class="navbar" style="position: sticky; top: 0;">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="Gaya College Logo"
                    style="height: 40px; margin-right: 10px; vertical-align: middle;">
                Gaya College
            </a>
            <a href="index.html" class="btn btn-outline small">Back to Home</a>
        </div>
    </nav>

    <div class="admin-container">
        <div class="section-header" style="text-align: center; margin-bottom: 30px;">
            <h2 class="section-title">Manage Students</h2>
            <p style="color: var(--gray);">Add new students to the directory.</p>
        </div>

        <!-- Add Student Form -->
        <div class="form-card">
            <h3
                style="margin-bottom: 20px; color: var(--primary-color); border-bottom: 1px solid #eee; padding-bottom: 10px;">
                <i class="fa-solid fa-user-plus"></i> Add New Student
            </h3>
            <form id="addStudentForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="studentId">Student ID</label>
                        <input type="text" id="studentId" placeholder="e.g. GC/23/MCA/001" required>
                    </div>
                    <div class="form-group">
                        <label for="studentName">Full Name</label>
                        <input type="text" id="studentName" placeholder="Enter student name" required>
                    </div>
                    <div class="form-group">
                        <label for="studentCourse">Course</label>
                        <select id="studentCourse" required>
                            <option value="">Select Course</option>
                            <option value="MCA">MCA</option>
                            <option value="BCA">BCA</option>
                            <option value="MBA">MBA</option>
                            <option value="B.Sc (IT)">B.Sc (IT)</option>
                            <option value="B.Sc (Hons)">B.Sc (Hons)</option>
                            <option value="B.A (Hons)">B.A (Hons)</option>
                            <option value="B.Com">B.Com</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="studentSession">Session</label>
                        <input type="text" id="studentSession" placeholder="e.g. 2023-25" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="studentStatus">Status</label>
                        <select id="studentStatus" required>
                            <option value="Active">Active</option>
                            <option value="Thesis Pending">Thesis Pending</option>
                            <option value="Inactive">Inactive</option>
                            <option value="Graduated">Graduated</option>
                        </select>
                    </div>
                </div>
                <div style="margin-top: 20px; text-align: right;">
                    <button type="submit" class="btn btn-primary">Add Student</button>
                </div>
            </form>
        </div>

        <!-- Student List -->
        <h3 style="margin-bottom: 15px; color: var(--primary-color);">Enrolled Students Directory</h3>
        <div class="table-responsive">
            <table class="student-table" id="studentTable">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Session</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- Dynamic Data Will Appear Here -->
                </tbody>
            </table>
            <div id="noDataMsg" style="text-align: center; padding: 20px; display: none; color: #64748b;">
                No students added yet.
            </div>
        </div>
    </div>

    <script src="student.js"></script>
</body>

</html>
