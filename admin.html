<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admin Panel | Dynamic Content</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #d97706;
            --bg: #f1f5f9;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
        }

        .admin-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            margin-top: 0;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: inherit;
        }

        button {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
        }

        button:hover {
            opacity: 0.9;
        }

        .success-msg {
            background: #dcfce7;
            color: #166534;
            padding: 10px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }

        .preview-list {
            margin-top: 40px;
            border-top: 2px solid #e2e8f0;
            padding-top: 20px;
        }

        .preview-item {
            background: #f8fafc;
            padding: 15px;
            border-left: 4px solid var(--primary);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            background: #ef4444;
            padding: 5px 10px;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <h1><i class="fa-solid fa-lock"></i> Admin Panel</h1>
        <p>Post updates to the college website news ticker/updates section.</p>

        <form id="updateForm">
            <div class="form-group">
                <label>Update Title / Content</label>
                <input type="text" id="noticeContent" placeholder="e.g., College will remain closed tomorrow due to..."
                    required>
            </div>
            <div class="form-group">
                <label>Type</label>
                <select id="noticeType" style="width:100%; padding:10px; border-radius:6px; border:1px solid #cbd5e1;">
                    <option value="notice">General Notice (ℹ️)</option>
                    <option value="exam">Exam Alert (📢)</option>
                    <option value="event">Event (🗓️)</option>
                    <option value="admission">Admission (🔴)</option>
                </select>
            </div>
            <button type="submit">Post Update</button>
        </form>

        <div id="successMsg" class="success-msg">
            Update posted successfully! Check the homepage.
        </div>

        <div class="preview-list">
            <h3>Active Updates</h3>
            <div id="updatesList">
                <!-- Updates will be loaded here -->
            </div>
            <button onclick="clearAllUpdates()" style="background:#64748b; margin-top:10px; font-size:0.8rem;">Clear All
                Custom Updates</button>
        </div>

        <div style="margin-top: 20px; text-align: center;">
            <a href="view_registrations.html"
                style="color: white; background: var(--primary); padding: 20px 30px; border-radius: 8px; text-decoration: none; margin-right: 15px;">View
                Student Applications</a>
            <a href="view_inquiries.html"
                style="color: white; background: var(--secondary); padding: 20px 30px; border-radius: 8px; text-decoration: none; margin-right: 15px;">View
                Inquiries</a>
            <a href="index.html" style="color: var(--secondary); text-decoration: none;">&larr; Back to Website</a>
        </div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
